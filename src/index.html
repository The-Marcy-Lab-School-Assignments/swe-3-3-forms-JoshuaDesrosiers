<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>HTML 5 Boilerplate</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div>
    <h1>NYC Tech Summit 2026</h1>
    <p>March 15 2026 | 9:00 am - 5:00 pm | Manhattan Conference Center</p>
    </div>
    <form>
        
        <h2>Event RSVP</h2>
        <section>
        <p>First Name</p>
        <p>Last Name</p>
        <input type="text">
        <input type="text">
        <p>Email</p>
        <p>Number of Tickets</p>
        <input type="text">
        <input type="text">
        </section>
        <fieldset>
            <legend>Lunch Preference</legend>
            <input value="Chicken" type="radio">
            <label for="Chicken">Chicken</label>
            <input value="Fish" type="radio">
            <label for="Fish">Fish</label>
            <input value="Vegetarian" type="radio">
            <label for="Vegetarian">Vegetarian</label>
        </fieldset>
        <fieldset>
            <legend>Select Workshop Sessions (select all that apply)</legend>
            <input value="Session 1" type="checkbox">
            <label for="Session 1">Session 1</label>
            <input value="Session 2" type="checkbox">
            <label for="Session 2">Session 2</label>
            <input value="Session 3" type="checkbox">
            <label for="Session 3">Session 3</label>
            <input value="Session 4" type="checkbox">
            <label for="Session 4">Session 4</label>
            <input value="Session 5" type="checkbox">
            <label for="Session 5">Session 5</label>
        </fieldset>
        <p>Special Requests or Notes</p>
        <textarea placeholder="Dietary restrictions, accesibility needs, questions, etc"></textarea>
        <input type="submit">
    </form>
    <script src="index.js"></script>
  </body>
</html>
